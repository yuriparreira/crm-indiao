<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1612">
  <title>CRM Indião Store</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤠</text></svg>">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="marca">INDIÃO <span>CRM</span></div>
    <nav id="abas" hidden>
      <button data-aba="inicio" class="ativa">Início</button>
      <button data-aba="prospeccao">Prospecção</button>
      <button data-aba="leads">Leads</button>
      <button data-aba="visitas">Visitas</button>
      <button data-aba="usuarios" data-so="gestor">Usuários</button>
    </nav>
    <div class="quem" id="quem"></div>
  </header>

  <main id="app">
    <section id="tela-login" class="cartao login">
      <h1>Entrar no CRM</h1>
      <p>Digite seu e-mail. Você recebe um link de acesso (válido por 1 hora).</p>
      <form id="form-login">
        <input type="email" id="login-email" placeholder="seu@email.com" required autocomplete="email">
        <button type="submit" class="primario">Enviar link de acesso</button>
      </form>
      <p class="msg" id="login-msg"></p>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-caixa">
      <button class="fechar" id="modal-fechar" aria-label="Fechar">×</button>
      <div id="modal-corpo"></div>
    </div>
  </div>
  <div id="aviso" class="aviso" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
